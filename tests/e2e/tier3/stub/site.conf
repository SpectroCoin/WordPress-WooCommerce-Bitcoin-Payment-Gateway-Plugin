<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /certs/server.crt
    SSLCertificateKeyFile /certs/server.key
    # Apache will not hand PHP the Authorization header on its own, and the
    # plugin authenticates every order call with a bearer token.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>

<VirtualHost *:80>
    DocumentRoot /var/www/html
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
