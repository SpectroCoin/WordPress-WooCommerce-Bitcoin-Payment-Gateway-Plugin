name: End-to-end

# Drives a real payment through a real WooCommerce: configures the gateway,
# places an order, and delivers a callback for every status on the wire,
# asserting what the shop does with each one.
#
# The SpectroCoin API is stood in for by a stub answering as spectrocoin.com
# inside the compose network, so no credentials are needed and no request ever
# reaches the real API.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the end-to-end test
        run: ./tests/e2e/tier2/tier2.sh

      - name: Container logs on failure
        if: failure()
        run: cd tests/e2e/tier2 && docker compose logs --tail=150 || true
