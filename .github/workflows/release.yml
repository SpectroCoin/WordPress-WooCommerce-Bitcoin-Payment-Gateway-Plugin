name: Create tag and release

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Launch release.yml after closed PR"]
    types:
      - completed
  workflow_dispatch:

jobs:
  create_tag_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install GitHub CLI
        run: sudo apt-get install gh

      - name: Fetch Latest PR Info and Check for Existing Tag
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest merged PR title and body using GitHub CLI
          PR_TITLE=$(gh pr list --state merged --limit 1 --json title --jq '.[0].title')
          PR_BODY=$(gh pr list --state merged --limit 1 --json body --jq '.[0].body')

          # A release is cut only when the pull request title is the version
          # being released. Without this, any merged title becomes a tag: a
          # pull request called "Add a tier 3 test" would publish a release by
          # that name, and only the exists-check below has been stopping it.
          #
          # TAG_EXISTS is the gate every later step already reads, so setting
          # it here means "do not release" - whether because the tag exists or
          # because this merge is not a release at all.
          if ! printf '%s' "$PR_TITLE" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'$PR_TITLE' is not a version number, so nothing is released."
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            exit 0
          fi

          TAG_NAME="$PR_TITLE"
          
          # Check if the tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists. Exiting workflow."
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            exit 0
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
            echo "PR_TITLE: $PR_TITLE"
            echo "PR_BODY: $PR_BODY"
            echo "TAG_NAME: $TAG_NAME"

            # Create the tag and push it
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            # Create a release using GitHub CLI with the tag name and PR details
            RELEASE_OUTPUT=$(gh release create "$TAG_NAME" --title "$PR_TITLE" --notes "$PR_BODY")
            RELEASE_URL=$(echo "$RELEASE_OUTPUT" | grep -oP 'https://github.com/[^ ]+/releases/tag/[^ ]+')
            echo "Release URL: $RELEASE_URL"
            UPLOAD_URL=$(gh release view "$TAG_NAME" --json uploadUrl --jq '.uploadUrl')
            echo "UPLOAD_URL: $UPLOAD_URL"
            echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV
          fi

      - name: Install PHP dependencies
        # --no-dev: this install only feeds the release zip, which must not carry
        # the test toolchain into merchant installs. Plugin directories are served
        # over HTTP, so shipped dev packages are needless attack surface as well
        # as roughly 10x the download size.
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Create spectrocoin.zip (excluding tests directory and phpunit.xml)
        if: ${{ env.TAG_EXISTS == 'false' }}
        run: |
          mkdir spectrocoin-accepting-bitcoin  # Create folder for release package
          # Copy only necessary files, excluding unwanted ones
          find . -maxdepth 1 \
            -not -path './spectrocoin-accepting-bitcoin' \
            -not -path '.' \
            -not -path './.git' \
            -not -path './.github' \
            -not -path './README.txt' \
            -not -path './README.md' \
            -not -path './changelog.md' \
            -not -path './phpunit.xml' \
            -not -path './.gitignore' \
            -not -path './tests' \
            -exec cp -r {} spectrocoin-accepting-bitcoin/ \;
          zip -r spectrocoin.zip spectrocoin-accepting-bitcoin  # Create zip file
        shell: bash

      - name: Upload spectrocoin.zip as release asset
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: spectrocoin.zip
          asset_name: spectrocoin.zip
          asset_content_type: application/zip
