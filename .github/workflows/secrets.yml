name: Secrets

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  # A merchant private key was committed to the PHP client twice, nine years
  # apart, and sat in public history until an audit found it. This is the check
  # that would have caught it at the pull request.
  #
  # The upstream gitleaks action is not used: it requires a paid licence for
  # organisation-owned repositories. The binary itself is MIT licensed.
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # gitleaks scans history rather than the diff, so the whole history
          # has to be present or a secret added in an earlier commit on the
          # branch goes unnoticed.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan for committed secrets
        run: |
          set -euo pipefail
          # --redact keeps any match out of the public build log: a failing run
          # must not be the thing that publishes the secret.
          /tmp/gitleaks git . --redact --no-banner --exit-code 1
